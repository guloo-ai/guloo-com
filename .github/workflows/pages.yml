name: Deploy GULOO Founder Launch Page

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build approved public artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html about.html brand-story.html digital-identity.html faq.html robots.txt sitemap.xml CNAME _site/
          cp -R assets _site/assets

          # Fail closed if any internal company paths appear in the publication artifact.
          for forbidden in governance agent-os data finance people revenue; do
            test ! -e "_site/${forbidden}"
          done

          # Verify expected public entrypoints exist.
          test -f _site/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/CNAME
          test -f _site/assets/guloo-logo.svg
          test -f _site/assets/favicon.svg

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload approved public artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
